<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aai Ji Mini Mart - Online Grocery Store</title>
    <meta http-equiv="refresh" content="0; url=mobile-store.html">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-container {
            background: rgba(255,255,255,0.1);
            padding: 2rem;
            border-radius: 15px;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .store-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .btn-link {
            color: white;
            text-decoration: underline;
        }
        .btn-link:hover {
            color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="store-name">
            <i class="fas fa-store"></i> Aai Ji Mini Mart
        </div>
        <p>Your trusted neighborhood mini market</p>
        <div class="spinner"></div>
        <p>Redirecting to mobile store...</p>
        <p><small>If not redirected, <a href="mobile-store.html" class="btn-link">click here</a></small></p>
    </div>
</body>
</html>
