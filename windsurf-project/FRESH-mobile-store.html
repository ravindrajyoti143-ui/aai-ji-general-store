<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Aai Ji Mini Mart - Mobile Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f8f9fa; }
        .header { background: linear-gradient(135deg, #28a745, #20c997); color: white; padding: 1rem; text-align: center; }
        .store-name { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.5rem; }
        .store-tagline { font-size: 0.9rem; opacity: 0.9; }
        .search-box { width: 100%; padding: 0.75rem; border: none; border-radius: 25px; margin: 1rem 0; }
        .categories { padding: 1rem; background: white; margin-bottom: 1rem; }
        .category-btn { background: #f8f9fa; border: 1px solid #ddd; border-radius: 20px; padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; }
        .category-btn.active { background: #28a745; color: white; }
        .products { padding: 0 1rem; }
        .product-card { background: white; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-name { font-weight: bold; margin-bottom: 0.5rem; }
        .product-price { color: #28a745; font-weight: bold; font-size: 1.2rem; }
        .product-unit { color: #666; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .quantity-control { display: flex; align-items: center; gap: 0.5rem; }
        .quantity-btn { background: #f8f9fa; border: 1px solid #ddd; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; }
        .add-to-cart { background: #28a745; color: white; border: none; border-radius: 20px; padding: 0.5rem 1rem; margin-left: auto; cursor: pointer; }
        .floating-cart { position: fixed; bottom: 20px; right: 20px; background: #28a745; color: white; border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; }
        .cart-count { position: absolute; top: -5px; right: -5px; background: #dc3545; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        .cart-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; z-index: 2000; }
        .cart-content { position: absolute; bottom: 0; left: 0; right: 0; background: white; border-radius: 20px 20px 0 0; padding: 1.5rem; max-height: 80vh; overflow-y: auto; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid #f8f9fa; }
        .checkout-btn { background: #28a745; color: white; border: none; border-radius: 25px; padding: 1rem; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
        <div class="store-name">🛒 Aai Ji Mini Mart</div>
        <div class="store-tagline">Free delivery within 5km • Min order ₹500</div>
        <input type="text" class="search-box" placeholder="🔍 Search products..." id="searchInput">
    </div>

    <div class="categories">
        <button class="category-btn active" data-category="all">All Items</button>
        <button class="category-btn" data-category="grains">🌾 Grains</button>
        <button class="category-btn" data-category="dals">🫘 Dals</button>
        <button class="category-btn" data-category="oil">🛢️ Oil</button>
        <button class="category-btn" data-category="spices">🧂 Spices</button>
        <button class="category-btn" data-category="snacks">🍪 Snacks</button>
        <button class="category-btn" data-category="beverages">🥤 Beverages</button>
        <button class="category-btn" data-category="dairy">🥛 Dairy</button>
        <button class="category-btn" data-category="personal">🧼 Personal</button>
        <button class="category-btn" data-category="household">🧹 Household</button>
    </div>

    <div class="products" id="productsContainer">
        <!-- Products will be loaded here -->
    </div>

    <div class="floating-cart" id="floatingCart">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3>Shopping Cart</h3>
                <button onclick="closeCart()" style="background: none; border: none; font-size: 1.5rem;">×</button>
            </div>
            <div id="cartItems"></div>
            <div style="margin-top: 1rem; padding-top: 1rem; border-top: 2px solid #ddd;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Subtotal:</span>
                    <span id="subtotal">₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                    <span>Delivery Fee:</span>
                    <span id="deliveryFee">FREE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; color: #28a745;">
                    <span>Total:</span>
                    <span id="totalAmount">₹0</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn" disabled onclick="checkout()">
                    <i class="fas fa-check"></i> Place Order
                </button>
            </div>
        </div>
    </div>

    <script>
        const products = [
            { id: 1, name: "Basmati Rice", price: 120, unit: "1kg", category: "grains", icon: "🍚" },
            { id: 2, name: "Sona Masoori Rice", price: 80, unit: "1kg", category: "grains", icon: "🍚" },
            { id: 3, name: "Whole Wheat Atta", price: 60, unit: "1kg", category: "grains", icon: "🌾" },
            { id: 4, name: "Toor Dal", price: 140, unit: "1kg", category: "dals", icon: "🫘" },
            { id: 5, name: "Moong Dal", price: 120, unit: "1kg", category: "dals", icon: "🫘" },
            { id: 6, name: "Refined Oil", price: 110, unit: "1L", category: "oil", icon: "🛢️" },
            { id: 7, name: "Sunflower Oil", price: 140, unit: "1L", category: "oil", icon: "🛢️" },
            { id: 8, name: "Ghee", price: 450, unit: "500g", category: "oil", icon: "🧈" },
            { id: 9, name: "Turmeric Powder", price: 80, unit: "100g", category: "spices", icon: "🧂" },
            { id: 10, name: "Red Chilli Powder", price: 70, unit: "100g", category: "spices", icon: "🌶️" },
            { id: 11, name: "Salt", price: 20, unit: "1kg", category: "spices", icon: "🧂" },
            { id: 12, name: "Sugar", price: 45, unit: "1kg", category: "spices", icon: "🍚" },
            { id: 13, name: "Potato Chips", price: 40, unit: "100g", category: "snacks", icon: "🍪" },
            { id: 14, name: "Biscuits", price: 30, unit: "200g", category: "snacks", icon: "🍪" },
            { id: 15, name: "Tea Powder", price: 200, unit: "250g", category: "beverages", icon: "🍵" },
            { id: 16, name: "Coffee Powder", price: 250, unit: "200g", category: "beverages", icon: "☕" },
            { id: 17, name: "Milk", price: 55, unit: "1L", category: "beverages", icon: "🥛" },
            { id: 18, name: "Curd", price: 50, unit: "500g", category: "dairy", icon: "🥛" },
            { id: 19, name: "Paneer", price: 120, unit: "250g", category: "dairy", icon: "🧀" },
            { id: 20, name: "Butter", price: 180, unit: "250g", category: "dairy", icon: "🧈" },
            { id: 21, name: "Soap", price: 30, unit: "1pc", category: "personal", icon: "🧼" },
            { id: 22, name: "Shampoo", price: 120, unit: "200ml", category: "personal", icon: "🧴" },
            { id: 23, name: "Toothpaste", price: 80, unit: "100g", category: "personal", icon: "🦷" },
            { id: 24, name: "Detergent Powder", price: 100, unit: "1kg", category: "household", icon: "🧹" },
            { id: 25, name: "Dish Soap", price: 80, unit: "500ml", category: "household", icon: "🧴" }
        ];

        let cart = [];
        let currentCategory = 'all';
        let searchTerm = '';

        function loadProducts() {
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('productsContainer');
            let filteredProducts = products;

            if (currentCategory !== 'all') {
                filteredProducts = filteredProducts.filter(p => p.category === currentCategory);
            }

            if (searchTerm) {
                filteredProducts = filteredProducts.filter(p => 
                    p.name.toLowerCase().includes(searchTerm.toLowerCase())
                );
            }

            container.innerHTML = filteredProducts.map(product => `
                <div class="product-card">
                    <div class="product-name">${product.icon} ${product.name}</div>
                    <div class="product-price">₹${product.price}</div>
                    <div class="product-unit">${product.unit}</div>
                    <div class="quantity-control">
                        <button class="quantity-btn" onclick="updateQuantity(${product.id}, -1)">-</button>
                        <span id="qty-${product.id}">0</span>
                        <button class="quantity-btn" onclick="updateQuantity(${product.id}, 1)">+</button>
                        <button class="add-to-cart" onclick="addToCart(${product.id})">
                            <i class="fas fa-cart-plus"></i> Add
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateQuantity(productId, change) {
            const qtyDisplay = document.getElementById(`qty-${productId}`);
            let currentQty = parseInt(qtyDisplay.textContent);
            let newQty = Math.max(0, currentQty + change);
            qtyDisplay.textContent = newQty;
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const qtyDisplay = document.getElementById(`qty-${productId}`);
            const quantity = parseInt(qtyDisplay.textContent);

            if (quantity === 0) {
                alert('Please select quantity first');
                return;
            }

            const existingItem = cart.find(item => item.id === productId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ ...product, quantity });
            }

            qtyDisplay.textContent = '0';
            updateCartUI();
        }

        function updateCartUI() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cartCount').textContent = totalItems;

            const cartItemsContainer = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="text-align: center; color: #666;">Your cart is empty</p>';
            } else {
                cartItemsContainer.innerHTML = cart.map(item => `
                    <div class="cart-item">
                        <div>
                            <div>${item.name}</div>
                            <div style="color: #28a745;">₹${item.price} × ${item.quantity}</div>
                        </div>
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="updateCartQuantity(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="quantity-btn" onclick="updateCartQuantity(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `).join('');
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const deliveryFee = subtotal >= 500 ? 0 : 30;
            const total = subtotal + deliveryFee;

            document.getElementById('subtotal').textContent = `₹${subtotal}`;
            document.getElementById('deliveryFee').textContent = deliveryFee === 0 ? 'FREE' : `₹${deliveryFee}`;
            document.getElementById('totalAmount').textContent = `₹${total}`;

            const checkoutBtn = document.getElementById('checkoutBtn');
            if (subtotal < 500) {
                checkoutBtn.disabled = true;
                checkoutBtn.innerHTML = `Minimum order ₹500 (Add ₹${500 - subtotal} more)`;
            } else {
                checkoutBtn.disabled = false;
                checkoutBtn.innerHTML = '<i class="fas fa-check"></i> Place Order';
            }
        }

        function updateCartQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(item => item.id !== productId);
                }
                updateCartUI();
            }
        }

        function openCart() {
            document.getElementById('cartModal').style.display = 'block';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        function checkout() {
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            if (subtotal < 500) {
                alert('Minimum order amount is ₹500');
                return;
            }

            const orderId = 'ORD' + Date.now();
            alert(`Order placed successfully!\nOrder ID: ${orderId}\nWe'll call you shortly to confirm.`);
            
            cart = [];
            updateCartUI();
            closeCart();
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            updateCartUI();

            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.category;
                    renderProducts();
                });
            });

            document.getElementById('searchInput').addEventListener('input', function(e) {
                searchTerm = e.target.value;
                renderProducts();
            });

            document.getElementById('floatingCart').addEventListener('click', openCart);
        });
    </script>
</body>
</html>
