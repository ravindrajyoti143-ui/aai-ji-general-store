<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aai Ji Mini Mart</title>
    <meta http-equiv="refresh" content="2; url=mobile-store.html">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
        a:hover {
            color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Aai Ji Mini Mart</h1>
        <p>Your trusted neighborhood mini market</p>
        <div class="spinner"></div>
        <p>Loading your shopping experience...</p>
        <p><small>If not redirected in 2 seconds, <a href="mobile-store.html">click here</a></small></p>
    </div>
</body>
</html>
